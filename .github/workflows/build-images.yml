name: Build and Push Docker Images
on:
  push:
    paths:
      - 'workspaces/*/Dockerfile'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-workspaces: ${{ steps.changes.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed workspaces
        id: changes
        run: |
          # Detect which workspace Dockerfiles changed
          changed_workspaces=$(git diff --name-only HEAD^ HEAD | grep '^workspaces/.*/Dockerfile$' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "workspaces=$changed_workspaces" >> $GITHUB_OUTPUT

  build-images:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.changed-workspaces != '[]'
    strategy:
      matrix:
        workspace: ${{ fromJson(needs.detect-changes.outputs.changed-workspaces) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
          
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workspaces/${{ matrix.workspace }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.workspace }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.workspace }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
